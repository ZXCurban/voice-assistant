[project]
name = "hackathon-skeleton"
version = "0.1.0"
description = "Production-ready skeleton for hackathon Python project (no business logic)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "jinja2>=3.1",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
]

# Local NLU (ml-training models). Heavy and optional: the rest of the backend
# imports nothing from these packages. Install with: pip install ".[nlu]"
nlu = [
  "torch>=2.2",
  # 5.x is not verified against the trained checkpoints.
  "transformers>=4.41,<5",
  # rut5 tokenizer (spiece.model) needs it.
  "sentencepiece>=0.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["backend*", "infra*", "tests*"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true
ignore_missing_imports = false
plugins = []

# torch/transformers are optional (extra "nlu") and only used behind lazy
# imports in app.nlu.engine. They are treated as untyped so mypy gives the
# same result with and without them installed.
[[tool.mypy.overrides]]
module = ["torch", "transformers"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
addopts = "-q"
