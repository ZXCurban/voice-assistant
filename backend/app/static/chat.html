<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-консьерж клиники</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f4f5; }
  #app { max-width: 640px; margin: 0 auto; background: #fff; min-height: 100vh;
         display: flex; flex-direction: column; }
  header { padding: 12px 16px; border-bottom: 1px solid #e4e4e7; font-weight: 600;
           display: flex; align-items: center; justify-content: space-between; }
  #newchat { padding: 6px 12px; font-size: 14px; }
  #log { flex: 1; padding: 16px; overflow-y: auto; }
  .msg { margin: 8px 0; padding: 8px 12px; border-radius: 8px; max-width: 85%;
         white-space: pre-wrap; }
  .bot { background: #eef2ff; }
  .user { background: #dcfce7; margin-left: auto; }
  .err { background: #fee2e2; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #e4e4e7; }
  input { flex: 1; padding: 8px; font-size: 16px; }
  button { padding: 8px 16px; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<div id="app">
  <header><span>AI-консьерж клиники</span><button id="newchat" type="button">Новый чат</button></header>
  <div id="log"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Напишите сообщение..." autocomplete="off">
    <button type="submit" id="send">→</button>
  </form>
</div>
<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
let conversationId = localStorage.getItem('conversation_id') || null;

function add(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

add('Здравствуйте! Я AI-консьерж клиники. Чем могу помочь?', 'bot');

document.getElementById('newchat').addEventListener('click', () => {
  conversationId = null;
  localStorage.removeItem('conversation_id');
  log.innerHTML = '';
  add('Здравствуйте! Я AI-консьерж клиники. Чем могу помочь?', 'bot');
  input.focus();
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.disabled = true;
  send.disabled = true;
  add(text, 'user');
  const thinking = document.createElement('div');
  thinking.className = 'msg bot';
  thinking.textContent = '…';
  log.appendChild(thinking);
  try {
    const res = await fetch('/api/v1/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, conversation_id: conversationId }),
    });
    const data = await res.json();
    thinking.remove();
    if (!res.ok) {
      add('Ошибка: ' + (data.detail || res.status), 'err');
    } else {
      conversationId = data.conversation_id;
      localStorage.setItem('conversation_id', conversationId);
      add(data.message, 'bot');
    }
  } catch (err) {
    thinking.remove();
    add('Ошибка сети: ' + err, 'err');
  } finally {
    input.disabled = false;
    send.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
